<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon 多尺寸支持 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>CuisineChat - Temporary Chat Room | 临时聊天室</title>
    <meta name="description" content="A temporary, secure P2P chat room. Share messages, images and files instantly. No registration required. 纯前端临时聊天室，支持文件传输和图片分享。" />
    <meta name="keywords" content="chat, temporary chat, P2P chat, secure chat, file sharing, 临时聊天, 在线聊天, 文件传输" />
    <meta name="author" content="CuisineChat Team" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://cuisinechat.vercel.app/" />
    <!-- Hreflang (多语言同一 URL 的声明) -->
    <link rel="alternate" href="https://cuisinechat.vercel.app/" hreflang="x-default" />
    <link rel="alternate" href="https://cuisinechat.vercel.app/" hreflang="en" />
    <link rel="alternate" href="https://cuisinechat.vercel.app/" hreflang="zh" />
    <link rel="alternate" href="https://cuisinechat.vercel.app/" hreflang="ja" />
    <link rel="alternate" href="https://cuisinechat.vercel.app/" hreflang="ko" />
    
    <!-- Open Graph / Facebook / LINE / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cuisinechat.vercel.app/" />
    <meta property="og:title" content="CuisineChat — Private chat rooms that vanish" />
    <meta property="og:description" content="One room ID + a 3-digit code. Chat peer-to-peer with photos, files and voice — no sign-up, nothing stored." />
    <!-- 爬蟲不會解析相對路徑，必須使用完整網址；原稿見 scripts/og/ -->
    <meta property="og:image" content="https://cuisinechat.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://cuisinechat.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CuisineChat: a glowing lantern beside a chat preview. One room ID plus a 3-digit code; chat, share, then it vanishes." />
    <meta property="og:site_name" content="CuisineChat" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="ko_KR" />

    <!-- Twitter / X（規範使用 name 而非 property） -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CuisineChat — Private chat rooms that vanish" />
    <meta name="twitter:description" content="One room ID + a 3-digit code. Chat peer-to-peer with photos, files and voice — no sign-up, nothing stored." />
    <meta name="twitter:image" content="https://cuisinechat.vercel.app/og-image.jpg" />
    <meta name="twitter:image:alt" content="CuisineChat: a glowing lantern beside a chat preview. One room ID plus a 3-digit code; chat, share, then it vanishes." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#15110e" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#15110e" />

    <!-- Structured Data (JSON-LD) for WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CuisineChat",
      "url": "https://cuisinechat.vercel.app/",
      "applicationCategory": "CommunicationApplication",
      "operatingSystem": "All",
      "description": "Temporary, secure P2P chat room with image & file sharing.",
      "inLanguage": ["en", "zh", "ja", "ko"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    
    <!-- Google AdSense：本站是單頁應用，所有路由（含 /room/*）共用這個 index.html，因此每個頁面都會載入 -->
    <meta name="google-adsense-account" content="ca-pub-4880646654838411" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4880646654838411"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
