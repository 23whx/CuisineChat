<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon 多尺寸支持 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO：title、description、canonical、hreflang、Open Graph、JSON-LD 由建置期預渲染產生
         （src/seo/prerender.ts），每種語言各自一份：/、/zh、/ja、/ko -->
    <!-- seo:head:start --><!-- seo:head:end -->
    <meta name="author" content="CuisineChat" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 非阻塞載入：中文字體檔很大，不能卡住首屏渲染（LCP） -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" /></noscript>

    <!-- 預渲染正文的基本樣式（React 掛載前短暫可見） -->
    <style>
      html { background: #15110e; color: #f3e7d6; }
      .prerender { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem; font-family: 'Noto Sans TC', system-ui, sans-serif; line-height: 1.7; }
      .prerender-brand { font-family: 'Noto Serif TC', serif; font-size: 1.6rem; font-weight: 700; letter-spacing: .1em; }
      .prerender h1 { font-size: 1.5rem; color: #f2a541; }
      .prerender h2 { font-family: 'Noto Serif TC', serif; font-size: 1.25rem; margin-top: 2rem; }
      .prerender h3 { font-size: 1rem; margin: 1rem 0 .25rem; }
      .prerender p, .prerender li { color: #c9b8a3; }
      .prerender a { color: #f2a541; }
    </style>

    <!-- Theme Color -->
    <meta name="theme-color" content="#15110e" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#15110e" />

    
    <!-- Google AdSense：本站是單頁應用，所有路由（含 /room/*）共用這個 index.html，因此每個頁面都會載入 -->
    <meta name="google-adsense-account" content="ca-pub-4880646654838411" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4880646654838411"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"><!-- seo:body:start --><!-- seo:body:end --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
