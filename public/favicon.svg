<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CuisineChat 燈籠圖示（深夜食堂配色）。小尺寸下文字無法辨識，因此只畫燈籠輪廓 -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#f2a541" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#ffd48a"/>
      <stop offset=".5" stop-color="#f2a541"/>
      <stop offset="1" stop-color="#c2541f"/>
    </radialGradient>
    <clipPath id="shape">
      <ellipse cx="32" cy="30.5" rx="18" ry="20.5"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="#15110e"/>
  <circle cx="32" cy="30.5" r="31" fill="url(#glow)"/>

  <!-- 燈籠本體與竹骨 -->
  <ellipse cx="32" cy="30.5" rx="18" ry="20.5" fill="url(#body)"/>
  <g clip-path="url(#shape)" stroke="#8a3412" stroke-opacity=".35" stroke-width="1.2">
    <path d="M12 22h40M12 30.5h40M12 39h40"/>
  </g>

  <!-- 上下蓋 -->
  <rect x="23" y="7.5" width="18" height="5" rx="1.8" fill="#3b1a16"/>
  <rect x="23" y="48.5" width="18" height="5" rx="1.8" fill="#3b1a16"/>

  <!-- 流蘇 -->
  <path d="M32 53.5v6" stroke="#d64933" stroke-width="2.6" stroke-linecap="round"/>
</svg>
